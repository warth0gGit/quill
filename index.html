    <main class="page" id="page">
      <div class="sheets" id="sheets">
        <div class="sheet-layer" id="sheet-layer" aria-hidden="true"></div>
        <div id="editor"></div>
      </div>
      <span class="caret" id="caret" aria-hidden="true"></span>
    </main>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="print-sheet" id="print-sheet" role="dialog" aria-modal="true" aria-labelledby="print-title" hidden>
      <div class="ps-card">
        <div>
          <h2 id="print-title">Print</h2>
          <p class="ps-sub" id="print-sub"></p>
        </div>
        <div class="ps-row">
          <span>Colours</span>
          <div class="ps-seg" role="group" aria-label="Colours">
            <button type="button" data-colours="written" aria-pressed="true">As written</button>
            <button type="button" data-colours="black" aria-pressed="false">Black only</button>
          </div>
        </div>
        <div class="ps-row">
          <span>Page numbers</span>
          <div class="ps-seg" role="group" aria-label="Page numbers">
            <button type="button" data-numbers="on" aria-pressed="true">Bottom centre</button>
            <button type="button" data-numbers="off" aria-pressed="false">None</button>
          </div>
        </div>
        <p class="ps-hint">To save a PDF, choose “Microsoft Print to PDF” as the printer.</p>
        <div class="ps-actions">
          <button type="button" id="print-cancel">Cancel</button>
          <button type="button" class="go" id="print-go">Print…</button>
        </div>
      </div>
    </div>
